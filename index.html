<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwarmRescue-NG HUD</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0f172a;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
        }
        .panel {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }
        .main-view {
            flex: 2;
        }
        .side-view {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            color: #38bdf8;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        #map {
            width: 100%;
            height: 100%;
            background-color: #000;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
        }
        .drone-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
            box-shadow: 0 0 10px currentColor;
        }
        .drone-label {
            position: absolute;
            font-size: 10px;
            color: white;
            margin-top: 15px;
            margin-left: -20px;
            white-space: nowrap;
        }
        .drone-ready { background-color: #22c55e; color: #22c55e; }
        .drone-stale { background-color: #ef4444; color: #ef4444; }
        .drone-relay { background-color: #f59e0b; color: #f59e0b; }
        
        .log-container {
            flex: 1;
            overflow-y: auto;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .log-entry {
            padding: 5px;
            border-left: 3px solid #3b82f6;
            background: #0f172a;
        }
        .log-entry.VICTIM_DETECTED {
            border-left-color: #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }
        .log-entry.TASK_CREATE {
            border-left-color: #eab308;
        }
        .log-entry.TASK_RESULT {
            border-left-color: #22c55e;
        }
        .log-entry.BATTERY_TRANSFER {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }
        .ts {
            color: #64748b;
            font-size: 0.75rem;
        }
        
        .grid-line {
            position: absolute;
            background: #334155;
        }
        .grid-label {
            position: absolute;
            color: #475569;
            font-size: 1.5rem;
            font-weight: bold;
            opacity: 0.5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="panel main-view">
        <h2>Tactical Grid</h2>
        <div id="map">
            <!-- Sectors -->
            <div class="grid-line" style="top:50%; left:0; width:100%; height:2px;"></div>
            <div class="grid-line" style="left:50%; top:0; height:100%; width:2px;"></div>
            
            <div class="grid-label" style="top:25%; left:25%;">NW</div>
            <div class="grid-label" style="top:25%; left:75%;">NE</div>
            <div class="grid-label" style="top:75%; left:25%;">SW</div>
            <div class="grid-label" style="top:75%; left:75%;">SE</div>
            <div class="grid-label" style="top:50%; left:50%; transform:translate(-50%,-50%);">CENTER</div>
            
            <div id="drones-container"></div>
        </div>
    </div>

    <div class="side-view">
        <div class="panel" style="flex: 1;">
            <h2>Swarm Status</h2>
            <div id="status-container" class="log-container"></div>
        </div>
        
        <div class="panel" style="flex: 2;">
            <h2>Proof of Coordination Log</h2>
            <div id="event-log" class="log-container"></div>
        </div>
    </div>

    <script>
        const ws = new WebSocket("ws://localhost:8081");
        
        const mapEl = document.getElementById('map');
        const dronesContainer = document.getElementById('drones-container');
        const statusContainer = document.getElementById('status-container');
        const eventLog = document.getElementById('event-log');
        
        // Let's assume the grid is 200x200 internally
        function getMapPos(x, y) {
            // map x,y (0-200) to percentage 0-100
            // but we'll just scale it arbitrarily for demo
            return {
                left: `${(x % 100) + 10}%`,
                top: `${(y % 100) + 10}%`
            };
        }

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data.type === "STATE_UPDATE") {
                updateDrones(data.drones);
                updateEvents(data.events);
                updateStatus(data.drones, data.tasks);
            }
        };

        function updateDrones(drones) {
            dronesContainer.innerHTML = '';
            
            Object.values(drones).forEach(drone => {
                const isStale = drone.status === 'stale';
                const isRelay = drone.role === 'relay';
                const statusClass = isStale ? 'drone-stale' : isRelay ? 'drone-relay' : 'drone-ready';
                
                const el = document.createElement('div');
                const pos = drone.position || [0, 0];
                
                // Add some offset based on sector so they don't overlap initially
                let ox = 0, oy = 0;
                if(drone.sector === 'NW') { ox = 25; oy = 25; }
                if(drone.sector === 'NE') { ox = 75; oy = 25; }
                if(drone.sector === 'SW') { ox = 25; oy = 75; }
                if(drone.sector === 'SE') { ox = 75; oy = 75; }
                if(drone.sector === 'CENTER') { ox = 50; oy = 50; }
                
                el.className = `drone-dot ${statusClass}`;
                const maxSteps = 200;
                const range = 18; // ±9% around sector center
                el.style.left = `${ox + (Math.min(pos[0], maxSteps) / maxSteps) * range - range / 2}%`;
                el.style.top  = `${oy + (Math.min(pos[1], maxSteps) / maxSteps) * range - range / 2}%`;
                
                const label = document.createElement('div');
                label.className = 'drone-label';
                label.innerText = `${drone.peer_id} (${drone.battery}%)`;
                el.appendChild(label);
                
                dronesContainer.appendChild(el);
            });
        }

        function updateStatus(drones, tasks) {
            statusContainer.innerHTML = '';
            
            Object.values(drones).forEach(drone => {
                const isStale = drone.status === 'stale';
                const el = document.createElement('div');
                el.style.marginBottom = '10px';
                el.innerHTML = `
                    <strong>${drone.peer_id}</strong> [${drone.role}] 
                    <span style="color: ${isStale ? '#ef4444' : '#22c55e'}">${isStale ? 'OFFLINE' : 'ONLINE'}</span><br>
                    Sector: ${drone.sector} (${drone.sector_progress || 0}%) | Batt: ${drone.battery || 0}%
                `;
                statusContainer.appendChild(el);
            });
        }

        let seenEvents = new Set();
        function updateEvents(events) {
            events.forEach(ev => {
                const evId = ev.ts + ev.peer_id + ev.type;
                if (!seenEvents.has(evId)) {
                    seenEvents.add(evId);
                    
                    const el = document.createElement('div');
                    el.className = `log-entry ${ev.type}`;
                    
                    let details = "";
                    if (ev.type === "VICTIM_DETECTED") details = `Pos: ${ev.raw.position}`;
                    if (ev.type === "TASK_CREATE") details = `Task: ${ev.raw.task?.task_id} (${ev.raw.task?.type})`;
                    if (ev.type === "TASK_RESULT") details = `Result: ${ev.raw.result}`;
                    if (ev.type === "BATTERY_TRANSFER") details = `-> ${ev.raw.target_id} +${ev.raw.amount}%`;
                    
                    el.innerHTML = `
                        <div class="ts">${new Date(ev.ts).toISOString().split('T')[1].slice(0,-1)}</div>
                        <strong>[${ev.peer_id}] ${ev.type}</strong><br>
                        ${details}
                    `;
                    
                    eventLog.prepend(el);
                }
            });
        }
    </script>
</body>
</html>
